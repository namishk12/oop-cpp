name: CMake

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure midsem practice starters
        run: cmake -S practice/midsem -B build-midsem -DCMAKE_BUILD_TYPE=Debug

      - name: Build midsem practice starters
        run: cmake --build build-midsem --parallel

      - name: Compile DOCX practice question starters
        run: |
          for question in practice/docx_v2/*; do
            if [ -f "$question/CMakeLists.txt" ]; then
              name=$(basename "$question")
              cmake -S "$question" -B "build-docx-$name" -DCMAKE_BUILD_TYPE=Debug
              cmake --build "build-docx-$name" --parallel
            fi
          done
